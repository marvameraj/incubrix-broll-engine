services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=development
      - API_AUTH_TOKEN=incubrix-demo-token
      - WEBHOOK_SECRET=incubrix-webhook-secret
      - RATE_LIMIT_PER_MINUTE=300
      - LLM_PROVIDER=mock
      - FOOTAGE_PROVIDER=wikimedia
      - TTS_PROVIDER=sapi
      - ASR_PROVIDER=whisper
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3