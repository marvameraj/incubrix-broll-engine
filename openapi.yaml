openapi: 3.1.0
info:
  title: IncuBrix Script & Voiceover to B-Roll Engine API
  version: 1.0.0
  description: >
    Automated microservice converting audio or script into commercial-safe,
    scene-timed B-roll videos across multiple aspect ratios with synced captions and manifest.

servers:
  - url: http://localhost:8000
    description: Local Docker / Development server

paths:
  /api/v1/health:
    get:
      summary: Health Check
      description: Returns liveness status of the service.
      operationId: health_check
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/ready:
    get:
      summary: Readiness Check
      description: Verifies FFmpeg and storage backend availability.
      operationId: readiness_check
      responses:
        '200':
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  ffmpeg:
                    type: boolean
                    example: true
                  storage:
                    type: string
                    example: s3
                  providers:
                    type: object
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/broll/jobs:
    post:
      summary: Create B-roll Video Job
      description: Enqueues an asynchronous video generation job from text script, scene list, or audio URL.
      operationId: create_broll_job
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Unique client key preventing duplicate processing of the same payload.
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
          description: Request tracking ID propagated through logs and callbacks.
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: Bearer token (required in production).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/broll/jobs/upload:
    post:
      summary: Create B-roll Job via Audio File Upload
      description: Upload an mp3, wav, or m4a audio file directly to enqueue video generation.
      operationId: create_broll_job_upload
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio narration file (.mp3, .wav, or .m4a up to 50MB).
                aspect_ratios:
                  type: string
                  default: '16:9'
                  description: Comma-separated ratios (e.g. '16:9,9:16')
                style:
                  type: string
                  default: bright, modern, real-world footage
                burn_in:
                  type: boolean
                  default: true
      responses:
        '202':
          description: Audio uploaded and job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '400':
          description: Invalid audio format or empty file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{job_id}:
    get:
      summary: Get Job Status & Artifacts
      description: Polls the status, progress (0-100), and download links for finished videos and manifests.
      operationId: get_job_status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/broll/jobs/{job_id}/scenes/{scene_index}/swap:
    post:
      summary: Swap Single Scene Clip
      description: Replaces one scene's footage and re-assembles the video in seconds without re-rendering all scenes.
      operationId: swap_scene_clip
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: scene_index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_query:
                  type: string
                  description: New search query for this scene
                visual_hint:
                  type: string
                  description: Visual guidance
      responses:
        '200':
          description: Scene swapped and video updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  swapped_scene:
                    type: integer
                  swap_duration_s:
                    type: number
                  results:
                    type: object

components:
  schemas:
    CaptionsConfig:
      type: object
      properties:
        burn_in:
          type: boolean
          default: true
        srt:
          type: boolean
          default: true

    SceneInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Spoken text for this scene
        visual_hint:
          type: string
          description: Guidance for visual match

    JobCreateRequest:
      type: object
      properties:
        audio_url:
          type: string
          nullable: true
          description: Remote public URL to audio file (mp3, wav, m4a)
        script:
          type: string
          nullable: true
          description: Full plain-text script to synthesize
        scenes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SceneInput'
        voice:
          type: string
          default: en-IN-female
          description: TTS voice identifier (e.g. en-IN-female, hi-IN-female, ta-IN-female)
        aspect_ratios:
          type: array
          items:
            type: string
            enum: ['16:9', '9:16', '1:1']
          default: ['16:9']
        style:
          type: string
          default: bright, modern, real-world footage
        avoid:
          type: array
          items:
            type: string
          default: []
        captions:
          $ref: '#/components/schemas/CaptionsConfig'
        callback_url:
          type: string
          nullable: true
          description: Webhook URL signed with HMAC-SHA256 (X-IncuBrix-Signature)
        simulate_primary_outage:
          type: boolean
          default: false

    JobCreateResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          example: 0

    JobStatusResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        results:
          type: object
          nullable: true
          properties:
            video_16x9.mp4:
              type: string
            video_9x16.mp4:
              type: string
            captions.srt:
              type: string
            timeline.json:
              type: string
            manifest.json:
              type: string
        error:
          type: object
          nullable: true

    ErrorDetails:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          example: EMPTY_SCRIPT
        message:
          type: string
          example: Input script cannot be empty.
        retryable:
          type: boolean
          example: false
        correlation_id:
          type: string
        details:
          type: object

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'